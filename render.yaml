# Render Blueprint for the API server + the browser simulator (/simulation/).
# The simulator is static files in server/simulation that the SERVER hosts, so deploying only server/ is enough.
# The dashboard goes to Vercel separately (see docs/deployment.md).
services:
  - type: web
    name: vision-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci --include=dev && npm run build:sim && npm run build
    startCommand: npm start
    healthCheckPath: /api/system/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: ROBOT_MODE
        value: simulation          # the simulator needs this (hardware mode refuses simulator endpoints)
      - key: COOKIE_SAMESITE
        value: none                # dashboard (vercel.app) and API (onrender.com) are different sites
      - key: FRONTEND_URL
        sync: false                # your Vercel URL, exactly, no trailing slash: https://your-app.vercel.app
      - key: DATABASE_URL
        sync: false                # e.g. your Neon / Render Postgres connection string
      - key: JWT_SECRET
        generateValue: true
      - key: ROBOT_AUTH_SECRET
        generateValue: true
